[project]
name = "factory-ledger-mcp"
version = "0.1.0"
description = "Factory Ledger MCP adapter with per-user auth and confirmed writes"
requires-python = ">=3.12,<3.14"
dependencies = [
  "mcp>=1.28,<2",
  "httpx>=0.28,<0.29",
  "jsonschema[format]>=4.23,<5",
  "starlette>=0.46,<1",
  "uvicorn>=0.34,<1",
]

[project.scripts]
factory-ledger-mcp = "factory_ledger_mcp.server:main"
factory-ledger-demo = "factory_ledger_mcp.demo:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "PyYAML>=6,<7", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory_ledger_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }, { file = "src/**/*.json" }]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
