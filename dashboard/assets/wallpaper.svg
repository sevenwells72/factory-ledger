<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 2400 1600" role="img" aria-labelledby="title desc">
  <title id="title">First light over the fields</title>
  <desc id="desc">An original illustration of a warm sunrise above a distant mountain ridge, rolling green hills, and curved rows of crops and golden grain.</desc>
  <!-- Original, hand-authored vector artwork for Factory Ledger, October 2026.
       No photographs, stock artwork, external resources, or embedded raster images.
       Export: rsvg-convert wallpaper.svg -o /tmp/fl-wallpaper.png
               cwebp -q 84 -m 6 /tmp/fl-wallpaper.png -o wallpaper.webp -->
  <defs>
