<style>
:root {
  --hit-min: 44px; /* minimum hit region, TOUCH-003 — same token as dashboard.css */
  --bg: #0f172a;
  --surface: #1e293b;
  --surface2: #283548;
  --text: #f1f5f9;
  --text-secondary: #cbd5e1;
  --text-muted: #94a3b8;
  /* #64748b measured 3.07–3.75:1 on this page's three surfaces (07 cluster
     A8); #8392a6 is the nearest value, hue/saturation held, clearing 4.6 on
     all of them (--surface 4.62, --card-bg 5.02, --bg 5.63). */
  --text-dimmed: #8392a6;
  --border: #334155;
  --card-bg: #16213e;
  --card-border: rgba(255,255,255,0.08);
  --row-border: rgba(255,255,255,0.04);
  --primary: #1b6df5;      /* fill under white text, 4.61:1 — see dashboard.css */
  --primary-text: #669ef8; /* links / text on a surface — see dashboard.css --primary-text */
  --primary-hover: #60a5fa;
  --accent: #10b981;
  --danger: #f16161;       /* dashboard.css's dark --danger; #ef4444 measures 3.89 as text on --surface */
  --warning: #f59e0b;
  --badge-green-text: #6ee7b7;
  --badge-amber-text: #fbbf24;
  --badge-red-text: #fca5a5;
  --radius: 8px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --mono: "SF Mono", "Fira Code", "Cascadia Code", monospace;

  --col-supplier: #1D9E75;
  --col-ingredient: #378ADD;
  --col-batch: #7F77DD;
  --col-finished: #D85A30;
  --col-customer: #BA7517;
  --col-gap: #E24B4A;
}
/* Light palette (07 cluster A8 / IMP-027) — dashboard.css's light token
   values, so the page follows the shared `dashboard-theme` preference. The
   node colours are darkened, hue/saturation held, to clear 4.6:1 as text on
   --surface / --bg (they label nodes, the legend and .legacy-tag); the graph
   nodes take the same values through var(--col-*). --accent is text here
   (.confirmed-tag) and dashboard.css's #059669 measures 3.77 on white, so it
   is #047552 (5.72). The print block below applies this palette too: a
   printed page is a light surface, and the old print rules left
   .detail-card h3 at #f1f5f9 on white (1.10:1). */
[data-theme="light"] {
  --bg: #f1f5f9;
  --surface: #ffffff;
  --surface2: #e2e8f0;
  --text: #0f172a;
  --text-secondary: #334155;
  --text-muted: #5b697e;
  --text-dimmed: #5b697e;
  --border: #cbd5e1;
  --card-bg: #ffffff;
  --card-border: #cbd5e1;
  --row-border: #e2e8f0;
  --primary: #2563eb;
  --primary-text: #195aea;
  --primary-hover: #1d4ed8;
  --accent: #047552;
  --danger: #c82020;
  --warning: #d97706;
  --badge-green-text: #065f46;
  --badge-amber-text: #92400e;
  --badge-red-text: #991b1b;

  --col-supplier: #177d5d;
  --col-ingredient: #2170c0;
  --col-batch: #685ed7;
  --col-finished: #bd4a24;
  --col-customer: #9c6213;
  --col-gap: #d72423;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; padding-top: 48px; }
a { color: var(--primary-text); text-decoration: none; }
a:hover { text-decoration: underline; }

/* Site Nav */
.site-nav { position:fixed;top:0;left:0;right:0;height:48px;z-index:200;background:#1a1a2e;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:space-between;padding:0 20px; }
.site-nav-brand { font-size:var(--fl-body, 15px);font-weight:700;color:#f1f5f9;white-space:nowrap;letter-spacing:-0.3px; }
.site-nav-links { display:flex;gap:4px;align-items:center; }
.site-nav-link { display:inline-flex;align-items:center;min-height:var(--hit-min);padding:5px 14px;border-radius:6px;font-size:var(--fl-caption, 14px);font-weight:500;color:#94a3b8;text-decoration:none;transition:all 0.15s;white-space:nowrap; }
.site-nav-link:hover { color:#f1f5f9;background:rgba(255,255,255,0.06);text-decoration:none; }
.site-nav-link.active { color:#fff;background:var(--primary); }
.site-nav-toggle { display:none;background:none;border:1px solid rgba(255,255,255,0.12);border-radius:6px;color:#94a3b8;font-size:var(--fl-headline, 18px);padding:4px 10px;min-width:var(--hit-min);min-height:var(--hit-min);cursor:pointer;line-height:1; }
@media(max-width:768px){
  .site-nav{flex-wrap:wrap;height:auto;min-height:48px}
  .site-nav-toggle{display:block}
  .site-nav-links{display:none;width:100%;flex-direction:column;gap:2px;padding:4px 0 8px;border-top:1px solid rgba(255,255,255,0.06)}
  .site-nav-links.open{display:flex}
  .site-nav-link{padding:8px 14px;width:100%;border-radius:4px}
}

/* Header */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 12px 24px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 48px; z-index: 100;
}
.header h1 { font-size:var(--fl-headline, 18px); font-weight: 600; display: flex; align-items: center; gap: 8px; }
.header-right { display: flex; align-items: center; gap: 12px; font-size:var(--fl-caption, 14px); color: var(--text-muted); }
.back-link { font-size:var(--fl-caption, 14px); display: flex; align-items: center; gap: 4px; }

/* The wrap dashboard.css:2223-2225 already gives index.html. Without it
   .mini-calendar-strip cannot take its own row and pushes .header-right
   past the viewport (LAYOUT-003 / cluster O1). mini-calendar.css:136-143
   already sets `order: 10; width: 100%` on the strip, which only does
   anything inside a wrapping flex container. */
@media (max-width: 768px) {
  .header { flex-wrap: wrap; gap: 8px; }
  .header-right { width: 100%; flex-wrap: wrap; }
}

/* Search area */
.search-area {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 16px 24px;
}
.search-row {
  display: flex; align-items: center; gap: 12px; max-width: 900px; margin: 0 auto;
}
.search-input-wrap {
  flex: 1; position: relative;
}
.search-input {
  width: 100%; min-height: var(--hit-min); padding: 10px 14px 10px 36px;
  background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius);
  color: var(--text); font-size:var(--fl-body, 14px); font-family: var(--mono); outline: none;
}
.search-input:focus { border-color: var(--primary-text); }
.search-input::placeholder { color: var(--text-muted); opacity: 1; }
.search-icon {
  position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
  color: var(--text-muted); font-size:var(--fl-body, 15px); pointer-events: none;
}
.search-dropdown {
  position: absolute; top: calc(100% + 4px); left: 0; right: 0;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  max-height: 320px; overflow-y: auto; z-index: 200; display: none;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}
.search-dropdown.open { display: block; }
.search-group-label {
  padding: 6px 12px; font-size:var(--fl-caption, 14px); font-weight: 600; text-transform: uppercase;
  color: var(--text-dimmed); background: var(--bg); letter-spacing: 0.5px;
}
.search-item {
  padding: 8px 12px; cursor: pointer; display: flex; justify-content: space-between;
  align-items: center; font-size:var(--fl-caption, 14px); border-bottom: 1px solid var(--row-border);
}
.search-item:hover { background: var(--surface2); }
.search-item .lot-code { font-family: var(--mono); color: var(--text); }
.search-item .product-name { color: var(--text-muted); font-size:var(--fl-caption, 14px); max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.direction-btns { display: flex; gap: 4px; }
.dir-btn {
  min-height: var(--hit-min); padding: 8px 16px; border: 1px solid var(--border); border-radius: var(--radius);
  background: transparent; color: var(--text-muted); font-size:var(--fl-caption, 14px); cursor: pointer;
  transition: all 0.15s;
}
.dir-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }
.dir-btn:hover:not(.active) { border-color: var(--text-muted); color: var(--text); }

.trace-btn {
  min-height: var(--hit-min); padding: 8px 20px; border: none; border-radius: var(--radius);
  background: var(--primary); color: #fff; font-size:var(--fl-caption, 14px); font-weight: 600;
  cursor: pointer; transition: background 0.15s;
}
.trace-btn:hover { background: var(--primary-hover); }
.trace-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* Recent lots */
.recent-lots {
  max-width: 900px; margin: 10px auto 0; display: flex; flex-wrap: wrap;
  gap: 6px; align-items: center; max-height: 60px; overflow: hidden;
}
.recent-label { font-size:var(--fl-caption, 14px); color: var(--text-dimmed); margin-right: 4px; }
.lot-pill {
  padding: 3px 10px; border-radius: 12px; font-size:var(--fl-caption, 14px); font-family: var(--mono);
  background: rgba(59,130,246,0.1); border: 1px solid rgba(59,130,246,0.2);
  color: var(--text-muted); cursor: pointer; transition: all 0.15s;
}
.lot-pill:hover { background: rgba(59,130,246,0.2); color: var(--text); }

/* Completeness badge */
.completeness-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 12px; border-radius: 12px; font-size:var(--fl-caption, 14px); font-weight: 600;
}
.badge-complete { background: rgba(16,185,129,0.15); color: var(--badge-green-text); border: 1px solid rgba(16,185,129,0.3); }
.badge-partial { background: rgba(245,158,11,0.15); color: var(--badge-amber-text); border: 1px solid rgba(245,158,11,0.3); }
.badge-incomplete { background: rgba(239,68,68,0.15); color: var(--badge-red-text); border: 1px solid rgba(239,68,68,0.3); }

/* Graph area */
.graph-container {
  position: relative; min-height: 400px; margin: 0;
  border-bottom: 1px solid var(--border);
}
.graph-controls {
  position: absolute; top: 12px; right: 12px; z-index: 10;
  display: flex; gap: 6px;
}
.graph-ctrl-btn {
  min-width: var(--hit-min); min-height: var(--hit-min); padding: 5px 10px; border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); color: var(--text-muted); font-size:var(--fl-caption, 14px);
  cursor: pointer; transition: all 0.15s;
}
.graph-ctrl-btn:hover { border-color: var(--text-muted); color: var(--text); }
.trace-info {
  position: absolute; top: 12px; left: 12px; z-index: 10;
  display: flex; align-items: center; gap: 10px;
}
svg text { font-family: var(--font); }

/* Status area */
.status-bar {
  padding: 12px 24px; text-align: center; color: var(--text-muted); font-size:var(--fl-caption, 14px);
  min-height: 44px; display: flex; align-items: center; justify-content: center; gap: 8px;
}
.status-bar.error { color: var(--danger); }
.loading-spinner {
  width: 16px; height: 16px; border: 2px solid var(--border);
  border-top-color: var(--primary); border-radius: 50%;
  animation: spin 0.7s linear infinite; display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Detail panel */
.detail-panel {
  max-width: 1000px; margin: 16px auto; padding: 0 24px; display: none;
}
.detail-card {
  background: var(--card-bg); border: 1px solid var(--card-border);
  border-radius: var(--radius); padding: 20px; margin-bottom: 16px;
}
.detail-card h3 { font-size:var(--fl-body, 15px); margin-bottom: 12px; color: var(--text); display: flex; align-items: center; gap: 8px; }
.detail-table { width: 100%; border-collapse: collapse; font-size:var(--fl-caption, 14px); }
.detail-table th {
  text-align: left; padding: 6px 10px; color: var(--text-dimmed); font-weight: 500;
  border-bottom: 1px solid var(--border); font-size:var(--fl-caption, 14px); text-transform: uppercase; letter-spacing: 0.3px;
}
.detail-table td {
  padding: 6px 10px; border-bottom: 1px solid var(--row-border);
  color: var(--text-secondary); font-family: var(--mono); font-size:var(--fl-caption, 14px);
}
.detail-table td.name-col { font-family: var(--font); }
.confirmed-tag { color: var(--accent); font-size:var(--fl-caption, 14px); }
.legacy-tag { color: var(--col-gap); font-size:var(--fl-caption, 14px); }
/* Recorded-ingredients check (display only) above the trace table; prints with the page */
.mismatch-list { margin: 0 0 14px; padding: 10px 12px; border: 1px solid rgba(245,158,11,0.3);
  border-radius: 6px; background: rgba(245,158,11,0.15); color: var(--badge-amber-text);
  font-size: var(--fl-caption, 14px); }
.mismatch-list ul { margin: 6px 0 0; padding-left: 18px; }

/* Export panel */
.export-btns {
  display: flex; gap: 8px; margin-top: 16px;
}
.export-btn {
  min-height: var(--hit-min); padding: 6px 14px; border: 1px solid var(--border); border-radius: var(--radius);
  background: transparent; color: var(--text-muted); font-size:var(--fl-caption, 14px);
  cursor: pointer; transition: all 0.15s;
}
.export-btn:hover { border-color: var(--text-muted); color: var(--text); }

/* Node tooltip */
.node-tooltip {
  position: absolute; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 10px 14px; font-size:var(--fl-caption, 14px);
  pointer-events: none; z-index: 300; max-width: 320px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4); display: none;
}
.node-tooltip .tt-label { color: var(--text-dimmed); font-size:var(--fl-caption, 14px); text-transform: uppercase; letter-spacing: 0.3px; }
.node-tooltip .tt-value { color: var(--text); margin-bottom: 4px; }
.node-tooltip .tt-mono { font-family: var(--mono); }

/* Legend */
.legend {
  display: flex; flex-wrap: wrap; gap: 14px; padding: 8px 24px;
  border-bottom: 1px solid var(--border); font-size:var(--fl-caption, 14px);
}
.legend-item { display: flex; align-items: center; gap: 5px; color: var(--text-muted); }
.legend-swatch {
  width: 14px; height: 14px; border-radius: 3px; border: 1px solid;
}
.legend-line { width: 24px; height: 0; border-top: 2px solid; }
.legend-line.dashed { border-top-style: dashed; }

/* Print styles */
@media print {
  /* The light palette, whichever theme is on screen (see the token block). */
  :root {
    --bg: #ffffff; --surface: #ffffff; --surface2: #e2e8f0;
    --text: #0f172a; --text-secondary: #334155; --text-muted: #5b697e; --text-dimmed: #5b697e;
    --border: #cbd5e1; --card-bg: #ffffff; --card-border: #cbd5e1; --row-border: #e2e8f0;
    --primary: #2563eb; --primary-text: #195aea; --primary-hover: #1d4ed8;
    --accent: #047552; --danger: #c82020; --warning: #d97706;
    --badge-green-text: #065f46; --badge-amber-text: #92400e; --badge-red-text: #991b1b;
    --col-supplier: #177d5d; --col-ingredient: #2170c0; --col-batch: #685ed7;
    --col-finished: #bd4a24; --col-customer: #9c6213; --col-gap: #d72423;
  }
  .site-nav, .header, .search-area, .graph-container, .legend, .graph-controls, .export-btns, .recent-lots { display: none !important; }
  .detail-panel { display: block !important; max-width: 100%; padding: 0; }
  body { background: #fff; }
}
</style>

<script>
// ═══════════════════════════════════════════════════════
// CONFIG & STATE
// ═══════════════════════════════════════════════════════
function displaySource(value) {
  const labels = { pack_output: 'Packed output', make_output: 'Produced output', received: 'Receipt' };
  return labels[value] || String(value || 'Unknown').replaceAll('_', ' ');
}
const API_BASE = 'https://fastapi-production-b73a.up.railway.app';

let direction = 'forward';
let lotIndex = [];
let currentTrace = null;
let graphNodes = [];
let graphLinks = [];
let depthLimit = 2;
let fullChainMode = false;
let svgZoom = null;
let selectedLotCode = '';


// ═══════════════════════════════════════════════════════
// API HELPERS
// ═══════════════════════════════════════════════════════
async function api(path, options = {}) {
  const res = await FL.fetchWithTimeout(API_BASE + path, { ...options, headers: { 'X-Api-Key': await FLDashboard.key() } });
  const data = await res.json();
  if (!res.ok) {
    const err = new Error(data.detail || data.error || `HTTP ${res.status}`);
    err.status = res.status;
    err.data = data;
    throw err;
  }
  return data;
}

function productIdParam() {
  return selectedProductId ? `product_id=${selectedProductId}` : '';
}
function appendParam(path, param) {
  if (!param) return path;
  return path + (path.includes('?') ? '&' : '?') + param;
}

// ═══════════════════════════════════════════════════════
// SEARCH INDEX & LOT LOOKUP
// ═══════════════════════════════════════════════════════
async function buildLotIndex() {
  try {
    const data = await api('/transactions/history?limit=100');
    const seen = new Set();
    for (const txn of data.transactions) {
      if (!txn.lines) continue;
      for (const line of txn.lines) {
        if (!line.lot_code || line.lot_id == null) continue;
        const key = line.lot_id;
        if (seen.has(key)) continue;
        seen.add(key);
        lotIndex.push({
          lot_code: line.lot_code,
          lot_id: line.lot_id,
          product_name: line.product_name || '',
          product_id: line.product_id || null,
          type: txn.type,
          date: txn.date || ''
        });
      }
    }
    lotIndex.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    renderRecentLots();
    if(document.querySelector('#statusBar button'))setStatus('ready');
  } catch (e) {
    console.error('[Index] Failed to build lot index:', e);
    if(e.accessUnavailable){const el=document.getElementById('statusBar');el.className='status-bar error';FLDashboard.renderAccess(el,async()=>{await buildLotIndex();});}
  }
}

let selectedProductId = null;

function renderRecentLots() {
  const el = document.getElementById('recentLots');
  el.innerHTML = '<span class="recent-label">Recent:</span>';
  const recent = lotIndex;
  const extra = document.createElement('details');
  const summary = document.createElement('summary');
  summary.textContent = 'Show ' + Math.max(0, recent.length - 6) + ' more recent lots';
  extra.append(summary);
  for (const lot of recent) {
    const pill = document.createElement('button');
    pill.type = 'button';
    pill.className = 'lot-pill';
    pill.textContent = lot.lot_code + ' — ' + lot.product_name;
    pill.title = lot.product_name;
    pill.dataset.productId = lot.product_id || '';
    pill.onclick = () => {
      document.getElementById('lotSearch').value = lot.lot_code;
      selectedLotCode = lot.lot_code;
      selectedProductId = lot.product_id || null;
      document.getElementById('traceBtn').disabled = false;
      closeDropdown();
    };
    (recent.indexOf(lot) < 6 ? el : extra).appendChild(pill);
  }
  if (recent.length > 6) el.append(extra);
}

// SEARCH DROPDOWN
// ═══════════════════════════════════════════════════════
const searchInput = document.getElementById('lotSearch');
const dropdown = document.getElementById('searchDropdown');
let debounceTimer = null;

searchInput.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  const q = searchInput.value.trim();
  if (q.length < 2) { selectedLotCode=null;selectedProductId=null;closeDropdown(); document.getElementById('traceBtn').disabled = true; return; }
  debounceTimer = setTimeout(() => filterLots(q), 200);
  selectedLotCode = q;
  selectedProductId = null;  // clear — user is typing manually
  document.getElementById('traceBtn').disabled = false;
});

searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); closeDropdown(); runTrace(); }
});

function escAttr(s) { return (s || '').replace(/&/g,'&amp;').replace(/'/g,'&#39;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

function filterLots(q) {
  const lower = q.toLowerCase();
  const groups = { receive: [], make: [], pack: [], ship: [] };
  for (const lot of lotIndex) {
    if (lot.lot_code.toLowerCase().includes(lower) || lot.product_name.toLowerCase().includes(lower)) {
      const g = groups[lot.type] || (groups.other = groups.other || []);
      g.push(lot);
    }
  }
  const labels = { receive: 'Received Lots', make: 'Production Lots', pack: 'Packed Lots', ship: 'Shipped Lots', other: 'Other' };
  let html = '';
  for (const [type, items] of Object.entries(groups)) {
    if (!items || items.length === 0) continue;
    html += `<div class="search-group-label">${labels[type] || type}</div>`;
    for (const it of items.slice(0, 8)) {
      html += `<div class="search-item" onclick="selectLot('${escAttr(it.lot_code)}', ${it.product_id || 'null'})">
        <span class="lot-code">${highlight(it.lot_code, q)}</span>
        <span class="product-name">${it.product_name}</span>
      </div>`;
    }
  }
  if (!html) html = '<div class="search-item" style="color:var(--text-dimmed)">No matches</div>';
  dropdown.innerHTML = html;
  dropdown.classList.add('open');
}

function highlight(text, q) {
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if (idx < 0) return text;
  return text.slice(0, idx) + '<strong style="color:var(--primary-text)">' + text.slice(idx, idx + q.length) + '</strong>' + text.slice(idx + q.length);
}

function selectLot(code, productId) {
  searchInput.value = code;
  selectedLotCode = code;
  selectedProductId = productId || null;
  document.getElementById('traceBtn').disabled = false;
  closeDropdown();
}

function closeDropdown() { dropdown.classList.remove('open'); }
document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-input-wrap')) closeDropdown();
});

// ═══════════════════════════════════════════════════════
// TRACE ENGINE
// ═══════════════════════════════════════════════════════
async function runTrace() {
  const lotCode = selectedLotCode || searchInput.value.trim();
  if (!lotCode) return;
  selectedLotCode = lotCode;

  setStatus('loading', `Building complete report for ${lotCode}… Large reports may take up to two minutes. Every recorded lot will be included.`);
  document.getElementById('detailPanel').style.display='none';
  document.getElementById('graphSvg').replaceChildren();
  document.getElementById('graphControls').style.display='none';
  document.getElementById('traceInfo').textContent='';
  graphNodes = [];
  graphLinks = [];
  currentTrace = null;

  try {
    await loadAuditReport(lotCode);
    renderDetailPanel();
    if (typeof d3 !== "undefined") renderGraph();
    else document.getElementById("graphContainer").style.display = "none";
    updateURL(lotCode, direction);
  } catch (e) {
    console.error('[Trace]', e);
    if (window.FL && FL.isStall(e)) {
      // The spinner would otherwise sit there indefinitely (IMP-005).
      const el = document.getElementById('statusBar');
      el.className = 'status-bar error';
      el.innerHTML = '';
      FL.renderStall(el, runTrace, null);
    } else if(e.accessUnavailable){
      const el=document.getElementById('statusBar');el.className='status-bar error';FLDashboard.renderAccess(el,runTrace);
    } else if (e.status === 409 && e.data && e.data.error === 'ambiguous_lot_code') {
      showDisambiguation(lotCode, e.data.matches);
    } else if (e.message.includes('404')) {
      setStatus('error', `No records found for lot code "${lotCode}". Check the lot code and try again.`);
      suggestSimilar(lotCode);
    } else {
      setStatus('error', `Trace failed: ${e.message}`);
    }
  }
}

function showDisambiguation(lotCode, matches) {
  const el = document.getElementById('statusBar');
  el.className = 'status-bar';
  el.replaceChildren();

  const heading = document.createElement('div');
  heading.style.padding = '8px 0';
  const headingLabel = document.createElement('strong');
  headingLabel.textContent = `Multiple lots found for "${lotCode}"`;
  heading.append(headingLabel, ' — select one:');

  const choices = document.createElement('div');
  choices.style.cssText = 'display:flex;flex-wrap:wrap;gap:8px;margin-top:4px';
  for (const m of matches) {
    const button = document.createElement('button');
    button.type = 'button';
    button.style.cssText = 'background:var(--surface2);border:1px solid var(--border);color:var(--text);'
      + 'border-radius:6px;padding:8px 14px;cursor:pointer;text-align:left;font-size:var(--fl-caption, 14px);font-family:var(--font)';
    const name = document.createElement('strong');
    name.textContent = m.product_name || 'Unnamed product';
    const meta = document.createElement('span');
    meta.style.cssText = 'font-size:var(--fl-caption, 14px);color:var(--text-muted)';
    meta.textContent = `ID: ${m.product_id} | Source: ${displaySource(m.entry_source)}`;
    button.append(name, document.createElement('br'), meta);
    button.addEventListener('click', () => pickDisambiguated(lotCode, m.product_id));
    choices.append(button);
  }

  el.append(heading, choices);
}

function pickDisambiguated(lotCode, productId) {
  selectedLotCode = lotCode;
  selectedProductId = productId;
  searchInput.value = lotCode;
  runTrace();
}

// ── BACKWARD TRACE: batch → ingredients → suppliers ──
async function loadAuditReport(lotCode) {
  const path=appendParam(`/dashboard/api/lot-report/${encodeURIComponent(lotCode)}?direction=${direction}`,productIdParam());
  let data;
  try { data=await api(path,{timeoutMs:120000}); }
  catch(e) {
    if(e.status===404 && e.data?.detail==='Not Found')throw new Error('The audit report API is not available yet. Please retry after the API update. No legacy or partial report is shown.');
    throw e;
  }
  if(data.report_version!==1 || !data.forward_trace || !Array.isArray(data.forward_trace.lots) || !Array.isArray(data.forward_trace.consumption) || !Array.isArray(data.forward_trace.gaps) || !data.forward_trace.lots.some(n=>n.lot_id===data.forward_trace.start_lot_id) || (direction==='backward' && !data.origin))
    throw new Error('The API did not return the complete audit report format. Please retry after the API update. No legacy report is shown.');
  if(data.complete!==true)throw new Error(`Incomplete report: ${data.incomplete_reason || 'the API did not confirm all lots were included'}. No partial report is shown.`);
  if(direction==='backward' && data.input_tree)await traceBackwardTree(data);
  else currentTrace={direction,startLot:lotCode,product:data.product_name};
  currentTrace.audit=FLTraceReport.build(data,direction);
  renderCompleteForward(data.forward_trace, direction==='backward' && !!data.input_tree);
  setStatus('ok','Complete report built from the posted current ledger.');
}

function escHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}

function fmtQty(quantity, unit) {
  const n = Number(quantity || 0).toLocaleString(undefined, { maximumFractionDigits: 2 });
  return `${n} ${unit || 'lb'}`;
}

function mismatchText(m) {
  return `Recorded ingredients: ${fmtQty(m.inputs)} for ${fmtQty(m.output)} made`;
}

// Mark a made lot's node with its producing transactions and the display-only
// recorded-inputs check (inputs outside 80–120% of the output). Nothing is changed.
function applyMadeOrigin(node, origin, stats) {
  if (!origin || origin.kind !== 'made') return;
  const txns = origin.transactions || [];
  if (txns.length) node.txnIds = txns.map(t => t.transaction_id);
  if (!origin.inputs_mismatch) return;
  node.mismatch = { inputs: origin.inputs_total_lb, output: origin.output_lb };
  node.detail = (node.detail ? node.detail + ' | ' : '') + mismatchText(node.mismatch);
  for (const t of txns) {
    if (!t.inputs_mismatch || stats.mismatches.some(m => m.txn === t.transaction_id)) continue;
    stats.mismatches.push({ txn: t.transaction_id, lot: node.label, product: node.sublabel,
                            inputs: t.inputs_total_lb, output: t.output_lb });
  }
}

function addLinkSum(sourceId, targetId, quantity, confidence, unit) {
  const link = graphLinks.find(l => l.source === sourceId && l.target === targetId);
  if (link) { link.quantity += quantity || 0; return; }
  graphLinks.push({ source: sourceId, target: targetId, quantity: quantity || 0, confidence, unit: unit || 'lb' });
}

function addGapNode(id, label, sublabel, detail, layer, targetId, stats, txnId) {
  addNode({ id, type: 'gap', label, sublabel, detail, layer, txnId: txnId || undefined });
  addLink(id, targetId, 0, 'legacy');
  stats.gaps++;
}

// Where a consumed lot came from when it was not made here.
function addOriginNode(lotNodeId, input, origin, layer, stats) {
  const txnRef = origin.transaction_id ? `Txn #${origin.transaction_id}` : '';
  if (origin.kind === 'received') {
    const parts = [`${origin.received_date || ''} ${origin.received_time || ''}`.trim(), txnRef];
    if (origin.receipt_number) parts.push(`Receipt ${origin.receipt_number}`);
    if (origin.supplier_lot_code) parts.push(`Supplier lot ${FLTraceReport.supplierLot(input)}`);
    const suppId = addNode({
      id: 'supplier-txn-' + origin.transaction_id, type: 'supplier',
      label: origin.supplier_name, sublabel: origin.bol_reference ? `BOL: ${origin.bol_reference}` : '',
      detail: parts.filter(Boolean).join(' | '), quantity: origin.quantity_lb,
      layer, txnId: origin.transaction_id
    });
    addLink(suppId, lotNodeId, origin.quantity_lb, 'confirmed');
    stats.confirmed++;
  } else if (origin.kind === 'found_inventory') {
    // A placeholder receipt ("found", "inventory found") is never a supplier.
    const recorded = origin.transaction_id
      ? ` | Recorded as "${origin.recorded_shipper || ''}" on ${txnRef}` : '';
    addGapNode('found-' + input.lot_id, 'Found inventory', 'No supplier receipt',
               'Found inventory — no supplier receipt' + recorded, layer, lotNodeId, stats, origin.transaction_id);
  } else if (origin.reason === 'receipt_without_supplier') {
    addGapNode('unnamed-' + input.lot_id, 'Supplier not named', 'Receipt names no supplier',
               `Receipt without a supplier name | ${txnRef}`, layer, lotNodeId, stats, origin.transaction_id);
  } else {
    addGapNode('noorigin-' + input.lot_id, 'No receipt recorded', 'Origin not in posted ledger',
               'No posted receipt, make or pack created this lot', layer, lotNodeId, stats);
  }
}

// Receipts posted onto a lot that was also made here (e.g. found inventory added to
// a packed lot). Each is an extra origin beside the lot's inputs; a placeholder or
// unnamed receipt is a gap, so the trace never reads as complete to suppliers.
function addAlsoReceived(lotNodeId, lotId, origin, layer, stats, lotMetadata) {
  for (const r of (origin && origin.also_received) || []) {
    const txnRef = `Txn #${r.transaction_id}`;
    const when = `${r.received_date || ''} ${r.received_time || ''}`.trim();
    const qty = `${fmtQty(r.quantity_lb)} received into this lot`;
    if (r.kind === 'received') {
      const parts = [qty, when, txnRef];
      if (r.receipt_number) parts.push(`Receipt ${r.receipt_number}`);
      if (r.supplier_lot_code) parts.push(`Supplier lot ${FLTraceReport.supplierLot({...r, ...lotMetadata})}`);
      const suppId = addNode({
        id: 'supplier-txn-' + r.transaction_id, type: 'supplier',
        label: r.supplier_name, sublabel: r.bol_reference ? `BOL: ${r.bol_reference}` : '',
        detail: parts.filter(Boolean).join(' | '), quantity: r.quantity_lb,
        layer, txnId: r.transaction_id
      });
      addLink(suppId, lotNodeId, r.quantity_lb, 'confirmed');
      stats.confirmed++;
    } else if (r.kind === 'found_inventory') {
      addGapNode(`found-${lotId}-${r.transaction_id}`, 'Found inventory', `${fmtQty(r.quantity_lb)} received`,
                 `Found inventory added to this lot — no supplier receipt | ${qty} | Recorded as "${r.recorded_shipper || ''}" on ${txnRef} | ${when}`,
                 layer, lotNodeId, stats, r.transaction_id);
    } else {
      addGapNode(`unnamed-${lotId}-${r.transaction_id}`, 'Supplier not named', `${fmtQty(r.quantity_lb)} received`,
                 `Receipt without a supplier name | ${qty} | ${txnRef} | ${when}`,
                 layer, lotNodeId, stats, r.transaction_id);
    }
  }
}

// Consumed lots of every posted make/pack in `origin`, one column further left
// per level. A lot consumed by several makes is one node with a summed link.
function addTreeInputs(parentId, origin, layer, stats) {
  if (origin.truncated) {
    addGapNode('stop-' + parentId, 'Trace stops here',
               origin.truncated === 'cycle' ? 'Lot is its own input' : 'Too many levels',
               origin.truncated === 'cycle' ? 'This lot appears in its own input chain' : 'Open this lot to trace further',
               layer, parentId, stats);
    return;
  }
  const byLot = new Map();
  for (const t of origin.transactions || []) {
    for (const input of t.inputs || []) {
      const entry = byLot.get(input.lot_id) || { input, quantity: 0, txns: [] };
      entry.quantity += input.quantity;
      entry.txns.push(t.transaction_id);
      byLot.set(input.lot_id, entry);
    }
  }
  for (const { input, quantity, txns } of byLot.values()) {
    const lotOrigin = input.origin || { kind: 'unknown' };
    const made = lotOrigin.kind === 'made';
    const isLb = (input.unit || 'lb') === 'lb';
    const node = {
      id: (made ? 'batch-' : 'ing-') + input.lot_id,
      type: made ? 'batch' : 'ingredient',
      label: input.lot_code, sublabel: input.product_name,
      detail: [`${fmtQty(quantity, input.unit)} recorded across whole make/pack transactions`, `Txn #${txns.join(', #')}`,
               input.supplier_lot_code ? `Supplier lot ${FLTraceReport.supplierLot(input)}` : ''].filter(Boolean).join(' | '),
      lotCode: input.lot_code, productId: input.product_id,
      quantity: isLb ? quantity : 0, layer
    };
    applyMadeOrigin(node, lotOrigin, stats);
    const seen = graphNodes.some(n => n.id === node.id);
    const nodeId = addNode(node);
    addLinkSum(nodeId, parentId, quantity, 'confirmed', input.unit);
    stats.confirmed++;
    if (seen) {
      const existing = graphNodes.find(n => n.id === nodeId);
      existing.quantity += isLb ? quantity : 0;
      existing.detail += ` | Also used by ${parentId}: ${fmtQty(quantity, input.unit)}; Txn #${txns.join(', #')}`;
      continue; // origins expand once; audit report lists every transaction/path
    }
    if (made) {
      addTreeInputs(nodeId, lotOrigin, layer - 1, stats);
      addAlsoReceived(nodeId, input.lot_id, lotOrigin, layer - 1, stats, input);
    } else addOriginNode(nodeId, input, lotOrigin, layer - 1, stats);
  }
}

function addCustomerNodes(lotNodeId, shipments, lotId, layer) {
  const customers = {};
  for (const sh of shipments || []) {
    const name = sh.customer_name || 'Unknown customer';
    const c = customers[name] || (customers[name] = { name, totalQty: 0, orders: [], txnIds: [], date: '' });
    c.totalQty += sh.quantity_lb;
    const order = sh.order_number || sh.order_reference;
    if (order && !c.orders.includes(order)) c.orders.push(order);
    c.txnIds.push(sh.transaction_id);
    c.date = sh.shipped_date;
  }
  for (const c of Object.values(customers)) {
    const custId = addNode({
      id: 'cust-' + c.name + '-' + lotNodeId, type: 'customer', label: c.name,
      sublabel: c.orders.join(', '),
      detail: `${fmtQty(c.totalQty)} | ${FLDesign.date(c.date)} | Txn #${c.txnIds.join(', #')}`,
      quantity: c.totalQty, layer, txnIds: c.txnIds
    });
    addLink(lotNodeId, custId, c.totalQty, 'confirmed');
  }
  if (!Object.keys(customers).length) {
    const stockId = addNode({ id: 'stock-' + lotId, type: 'finished', label: 'In stock',
                              sublabel: 'No shipments recorded', detail: '', layer });
    addLink(lotNodeId, stockId, 0, 'confirmed');
  }
}

async function traceBackwardTree(batchData) {
  const stats = { confirmed: 0, gaps: 0, mismatches: [] };
  const outputStr = batchData.output_units != null
    ? `${batchData.output_lb} lb · ${batchData.output_units} units`
    : (batchData.output_batches != null ? `${batchData.output_lb} lb · ${batchData.output_batches} batches` : `${batchData.output_lb} lb`);
  const start = {
    id: 'batch-' + batchData.lot_id, type: 'batch', label: batchData.batch_lot_code,
    sublabel: batchData.product_name,
    detail: `${outputStr} | ${batchData.produced_date} ${batchData.produced_time}`,
    lotCode: batchData.batch_lot_code, productId: batchData.product_id,
    quantity: batchData.input_tree.output_lb ?? batchData.output_lb, layer: 0
  };
  applyMadeOrigin(start, batchData.input_tree, stats);
  const startId = addNode(start);
  addTreeInputs(startId, batchData.input_tree, -1, stats);
  addAlsoReceived(startId, batchData.lot_id, batchData.input_tree, -1, stats, batchData.forward_trace?.lots.find(n=>n.lot_id===batchData.lot_id));
  addCustomerNodes(startId, batchData.customer_shipments, batchData.lot_id, 1);

  currentTrace = {
    direction: 'backward', startLot: batchData.batch_lot_code,
    product: batchData.product_name, kosherTier: batchData.kosher_tier, outputLb: start.quantity,
    date: batchData.produced_date, time: batchData.produced_time,
    confirmedCount: stats.confirmed, legacyCount: stats.gaps, hasLegacy: stats.gaps > 0,
    mismatches: stats.mismatches, batchData
  };
  setStatus('ok', '');
}

function renderCompleteForward(forward, append=false) {
  const prefix = n => (n.product_type === 'ingredient' ? 'ing-' : 'batch-') + n.lot_id;
  const byId = new Map(forward.lots.map(n=>[n.lot_id,n]));
  const layers = new Map([[forward.start_lot_id,append ? 0 : 1]]);
  // API lots are breadth-first; cycles retain edges without increasing depth.
  for (const n of forward.lots) {
    for (const e of forward.consumption.filter(e=>e.source_lot_id===n.lot_id)) {
      if (e.lot_id != null && !layers.has(e.lot_id)) layers.set(e.lot_id,(layers.get(n.lot_id)||0)+1);
    }
  }
  for (const n of forward.lots) {
    const id=prefix(n), layer=layers.get(n.lot_id)||0;
    addNode({id,type:n.product_type==='ingredient'?'ingredient':'batch',label:n.lot_code,
      sublabel:n.product_name,detail:`Remaining: ${fmtQty(n.on_hand,n.unit)}`,lotCode:n.lot_code,productId:n.product_id,layer});
    if (!append || n.lot_id!==forward.start_lot_id) {
      for (const sh of n.shipments) {
        const sid=`ship-${n.lot_id}-${sh.transaction_id}`;
        addNode({id:sid,type:'customer',label:sh.customer_name||'Customer not named',
          sublabel:sh.sales_orders.map(o=>o.order_number).join(', ')||sh.order_reference||'',
          detail:`Txn #${sh.transaction_id} · ${fmtQty(sh.quantity_lb,n.unit)}`,quantity:sh.quantity_lb,layer:layer+1});
        addLink(id,sid,sh.quantity_lb,'confirmed');
      }
    }
    const stock=`remaining-${n.lot_id}`;
    addNode({id:stock,type:'finished',label:'Remaining stock',sublabel:fmtQty(n.on_hand,n.unit),layer:layer+1});
    addLink(id,stock,n.on_hand,'confirmed');
  }
  for (const e of forward.consumption) if (e.lot_id!=null) {
    addLinkSum(prefix(byId.get(e.source_lot_id)),prefix(byId.get(e.lot_id)),e.quantity_used,'confirmed',e.unit);
  }
}

function addNode(node) {
  const existing = graphNodes.find(n => n.id === node.id);
  if (existing) return existing.id;
  graphNodes.push(node);
  return node.id;
}

function addLink(sourceId, targetId, quantity, confidence) {
  if (graphLinks.some(l => l.source === sourceId && l.target === targetId)) return;
  graphLinks.push({ source: sourceId, target: targetId, quantity: quantity || 0, confidence });
}

// ═══════════════════════════════════════════════════════
// STATUS
// ═══════════════════════════════════════════════════════
// Status and error text is API-controlled: always render it as text, never as
// markup, so a response body can never become live HTML in the status bar.
function setStatus(type, msg) {
  const el = document.getElementById('statusBar');
  el.replaceChildren();
  if (type === 'loading') {
    el.className = 'status-bar';
    const spinner = document.createElement('span');
    spinner.className = 'loading-spinner';
    el.append(spinner, ' ' + (msg || ''));
  } else if (type === 'error') {
    el.className = 'status-bar error';
    if (msg) el.append(String(msg));
  } else {
    el.className = 'status-bar';
  }
}

function suggestSimilar(query) {
  const lower = query.toLowerCase();
  const matches = lotIndex.filter(l => l.lot_code.toLowerCase().includes(lower.slice(0, 6))).slice(0, 5);
  if (matches.length === 0) return;
  const el = document.getElementById('statusBar');
  el.append(document.createElement('br'), 'Did you mean: ');
  for (const m of matches) {
    const link = document.createElement('a');
    link.href = '#';
    link.style.margin = '0 4px';
    link.textContent = m.lot_code;
    link.addEventListener('click', event => {
      event.preventDefault();
      selectLot(m.lot_code, m.product_id || null);
      runTrace();
    });
    el.append(link);
  }
}

// ═══════════════════════════════════════════════════════
// GRAPH RENDERING (D3)
// ═══════════════════════════════════════════════════════
const colorMap = {
  supplier: 'var(--col-supplier)', ingredient: 'var(--col-ingredient)',
  batch: 'var(--col-batch)', finished: 'var(--col-finished)',
  customer: 'var(--col-customer)', gap: 'var(--col-gap)'
};
// Read from the --col-* tokens so the graph follows the theme (the light
// palette darkens them); the hex is needed for the '1F' alpha suffix below.
const colorHex = new Proxy({}, { get: (_, type) => {
  const v = getComputedStyle(document.documentElement).getPropertyValue('--col-' + type).trim();
  return /^#[0-9a-fA-F]{6}$/.test(v) ? v : '#666';
} });

function renderGraph() {
  const container = document.getElementById('graphContainer');
  const svg = d3.select('#graphSvg');
  svg.selectAll('*').remove();
  document.getElementById('graphControls').style.display = '';

  if (graphNodes.length === 0) {
    document.getElementById('graphControls').style.display = 'none';
    return;
  }

  // Layout: layered left-to-right
  const width = container.clientWidth;
  const nodeW = 180, nodeH = 56, padX = 60;
  // Room under a node for its recorded-ingredients badge (badgeH) when any node has one.
  const badgeH = 26, padY = graphNodes.some(n => n.mismatch) ? badgeH + 12 : 20;

  // Group nodes by layer
  const layers = {};
  for (const n of graphNodes) {
    const layer = n.layer ?? 0;
    if (!layers[layer]) layers[layer] = [];
    layers[layer].push(n);
  }
  const layerKeys = Object.keys(layers).map(Number).sort((a, b) => a - b);
  const maxLayerSize = Math.max(...layerKeys.map(k => layers[k].length));
  const totalHeight = Math.max(500, maxLayerSize * (nodeH + padY) + 80);

  svg.attr('height', totalHeight);

  // Position nodes
  const layerCount = layerKeys.length;
  const totalW = layerCount * nodeW + (layerCount - 1) * padX;
  const startX = Math.max(40, (width - totalW) / 2);

  for (let li = 0; li < layerKeys.length; li++) {
    const layerNodes = layers[layerKeys[li]];
    const layerH = layerNodes.length * (nodeH + padY) - padY;
    const startY = (totalHeight - layerH) / 2;
    for (let ni = 0; ni < layerNodes.length; ni++) {
      layerNodes[ni].x = startX + li * (nodeW + padX);
      layerNodes[ni].y = startY + ni * (nodeH + padY);
    }
  }

  // Create zoom group
  const g = svg.append('g');

  svgZoom = d3.zoom()
    .scaleExtent([0.2, 3])
    .on('zoom', (event) => g.attr('transform', event.transform));
  svg.call(svgZoom);

  // Build node map for link lookup
  const nodeMap = {};
  for (const n of graphNodes) nodeMap[n.id] = n;

  // Draw links
  const linkGroup = g.append('g');
  for (const link of graphLinks) {
    const src = nodeMap[link.source];
    const tgt = nodeMap[link.target];
    if (!src || !tgt) continue;

    const x1 = src.x + nodeW;
    const y1 = src.y + nodeH / 2;
    const x2 = tgt.x;
    const y2 = tgt.y + nodeH / 2;
    const cpx = (x1 + x2) / 2;

    const isLegacy = link.confidence === 'legacy';
    const strokeW = isLegacy ? 1.5 : Math.max(1.5, Math.min(6, (link.quantity || 0) / 200));
    const color = isLegacy ? colorHex.gap : (colorHex[src.type] || '#666');

    const path = linkGroup.append('path')
      .attr('d', `M ${x1},${y1} C ${cpx},${y1} ${cpx},${y2} ${x2},${y2}`)
      .attr('fill', 'none')
      .attr('stroke', color)
      .attr('stroke-width', strokeW)
      .attr('opacity', 0.4);

    if (isLegacy) {
      path.attr('stroke-dasharray', '6,4');
    }

    // Quantity label on link
    if (link.quantity > 0) {
      linkGroup.append('text')
        .attr('x', cpx)
        .attr('y', (y1 + y2) / 2 - 6)
        .attr('text-anchor', 'middle')
        .attr('font-size', 10)
        .attr('fill', 'var(--text-dimmed)')
        .text(fmtQty(link.quantity, link.unit));
    }

    // Confidence icon
    if (!isLegacy && link.quantity > 0) {
      linkGroup.append('text')
        .attr('x', cpx)
        .attr('y', (y1 + y2) / 2 + 8)
        .attr('text-anchor', 'middle')
        .attr('font-size', 9)
        .attr('fill', 'var(--accent)')
        .text('\u2713');
    }
    if (isLegacy) {
      linkGroup.append('text')
        .attr('x', cpx)
        .attr('y', (y1 + y2) / 2 + 8)
        .attr('text-anchor', 'middle')
        .attr('font-size', 10)
        .attr('fill', 'var(--col-gap)')
        .text('\u26A0');
    }
  }

  // Draw nodes
  const nodeGroup = g.append('g');
  for (const node of graphNodes) {
    const ng = nodeGroup.append('g')
      .attr('transform', `translate(${node.x}, ${node.y})`)
      .attr('cursor', 'pointer')
      .on('click', () => onNodeClick(node))
      .on('mouseenter', (event) => showTooltip(event, node))
      .on('mouseleave', hideTooltip);

    // Background rect
    const hex = colorHex[node.type] || '#666';
    ng.append('rect')
      .attr('width', nodeW)
      .attr('height', nodeH)
      .attr('rx', 6)
      .attr('fill', hex + '1F')  // ~12% opacity
      .attr('stroke', hex)
      .attr('stroke-width', node.id === ('batch-' + selectedLotCode) || node.id === ('ing-' + selectedLotCode) || node.id === ('lot-' + selectedLotCode) ? 2 : 1)
      .attr('stroke-dasharray', (node.type === 'gap' || node.isLegacy) ? '4,3' : 'none');

    // Warning icon for gaps/legacy, and for a recorded-ingredients mismatch
    if (node.type === 'gap' || node.isLegacy || node.mismatch) {
      ng.append('text')
        .attr('x', nodeW - 16)
        .attr('y', 16)
        .attr('font-size', 13)
        .attr('fill', 'var(--col-gap)')
        .text('\u26A0');
    }

    // Label (lot code)
    ng.append('text')
      .attr('x', 10)
      .attr('y', 22)
      .attr('font-size', 12)
      .attr('font-weight', 600)
      .attr('fill', 'var(--text)')
      .text(truncate(node.label, 22));

    // Sublabel (product name)
    if (node.sublabel) {
      ng.append('text')
        .attr('x', 10)
        .attr('y', 38)
        .attr('font-size', 10)
        .attr('fill', 'var(--text-muted)')
        .text(truncate(node.sublabel, 26));
    }

    // Quantity badge
    if (node.quantity > 0) {
      ng.append('text')
        .attr('x', 10)
        .attr('y', 50)
        .attr('font-size', 9)
        .attr('fill', 'var(--text-dimmed)')
        .text(fmtQty(node.quantity));
    }

    // Recorded-ingredients badge (display only): inputs outside 80–120% of output
    if (node.mismatch) {
      const badge = ng.append('g')
        .attr('class', 'mismatch-badge')
        .attr('transform', `translate(0, ${nodeH + 4})`);
      badge.append('rect')
        .attr('width', nodeW).attr('height', badgeH).attr('rx', 4)
        .attr('fill', colorHex.gap + '1F').attr('stroke', colorHex.gap);
      badge.append('text').attr('x', 8).attr('y', 11).attr('font-size', 9.5)
        .attr('font-weight', 600).attr('fill', 'var(--text)')
        .text('\u26A0 Recorded ingredients:');
      badge.append('text').attr('x', 8).attr('y', 22).attr('font-size', 9.5)
        .attr('fill', 'var(--text)')
        .text(`${fmtQty(node.mismatch.inputs)} for ${fmtQty(node.mismatch.output)} made`);
    }
  }

  // Completeness badge
  renderCompleteness();

  // Auto-scroll graph into view
  container.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function truncate(str, max) {
  if (!str) return '';
  return str.length > max ? str.slice(0, max - 1) + '\u2026' : str;
}

// ═══════════════════════════════════════════════════════
// TOOLTIP
// ═══════════════════════════════════════════════════════
function showTooltip(event, node) {
  const tt = document.getElementById('tooltip');
  const typeLabel = { supplier: 'Supplier', ingredient: 'Ingredient Lot', batch: 'Production Batch', finished: 'Finished Goods', customer: 'Customer', gap: 'Data Gap' };

  tt.innerHTML = `
    <div class="tt-label">${escHtml(typeLabel[node.type] || node.type)}</div>
    <div class="tt-value tt-mono" style="font-weight:600">${escHtml(node.label)}</div>
    ${node.sublabel ? `<div class="tt-value">${escHtml(node.sublabel)}</div>` : ''}
    ${node.detail ? `<div class="tt-value" style="color:var(--text-muted);font-size:var(--fl-caption, 14px)">${escHtml(node.detail)}</div>` : ''}
    ${node.mismatch ? `<div style="color:var(--col-gap);font-size:var(--fl-caption, 14px);margin-top:4px">\u26A0 ${escHtml(mismatchText(node.mismatch))}</div>` : ''}
    ${node.isLegacy ? '<div style="color:var(--col-gap);font-size:var(--fl-caption, 14px);margin-top:4px">\u26A0 Legacy record — ingredient lot not tracked</div>' : ''}
    ${node.txnId ? `<div class="tt-label" style="margin-top:4px">Transaction #${node.txnId}</div>` : ''}
  `;
  tt.style.display = 'block';
  tt.style.left = (event.pageX + 12) + 'px';
  tt.style.top = (event.pageY - 8) + 'px';
}

function hideTooltip() {
  document.getElementById('tooltip').style.display = 'none';
}

// ═══════════════════════════════════════════════════════
// NODE CLICK — trace deeper
// ═══════════════════════════════════════════════════════
function onNodeClick(node) {
  if (node.isCollapsed) {
    fullChainMode = true;
    runTrace();
    return;
  }
  if (node.lotCode && node.lotCode !== 'UNKNOWN') {
    searchInput.value = node.lotCode;
    selectedLotCode = node.lotCode;
    selectedProductId = node.productId || null;
    // Auto-detect direction
    if (node.type === 'ingredient' || node.type === 'supplier') {
      setDirection('forward');
    } else if (node.type === 'batch' || node.type === 'finished') {
      setDirection('backward');
    }
  }
}

// ═══════════════════════════════════════════════════════
// GRAPH CONTROLS
// ═══════════════════════════════════════════════════════
function fitToScreen() {
  const svg = d3.select('#graphSvg');
  svg.transition().duration(300).call(svgZoom.transform, d3.zoomIdentity);
}

function zoomIn() {
  const svg = d3.select('#graphSvg');
  svg.transition().duration(200).call(svgZoom.scaleBy, 1.3);
}

function zoomOut() {
  const svg = d3.select('#graphSvg');
  svg.transition().duration(200).call(svgZoom.scaleBy, 0.77);
}

function toggleFullChain() {
  fullChainMode = !fullChainMode;
  document.getElementById('expandBtn').textContent = fullChainMode ? 'Collapse' : 'Show full chain';
  runTrace();
}

// ═══════════════════════════════════════════════════════
// COMPLETENESS BADGE
// ═══════════════════════════════════════════════════════
function renderCompleteness() {
  const info=document.getElementById('traceInfo');
  info.textContent=currentTrace?.audit ? `${currentTrace.audit.gaps.length} trace gap(s) · complete posted-ledger report below; estimated shares are not physically verified` : '';
}

function renderDetailPanel() {
  const panel=document.getElementById('detailPanel'), card=document.getElementById('traceDetail');
  if(!currentTrace?.audit){panel.style.display='none';return;}
  panel.style.display='block';
  card.innerHTML=`<a class="lot-history-action" href="lot-history.html?product_id=${encodeURIComponent(currentTrace.audit.productId)}">Back to lot history</a>`+FLTraceReport.html(currentTrace.audit);
  renderCompleteness();
}

function printAuditReport() {
  window.print();
}

function saveAuditText(text) {
  const url=URL.createObjectURL(new Blob([text],{type:'text/plain'}));
  const a=document.createElement('a');a.href=url;
  a.download=`trace-${currentTrace.startLot}-${currentTrace.direction}.txt`;a.click();URL.revokeObjectURL(url);
}

function downloadAuditText() {
  if(currentTrace?.audit)saveAuditText(FLTraceReport.text(currentTrace.audit));
}

function updateURL(lot, dir) {
  const url = new URL(window.location);
  url.searchParams.set('lot', lot);
  url.searchParams.set('direction', dir);
  if (selectedProductId) url.searchParams.set('product_id', selectedProductId);
  else url.searchParams.delete('product_id');
  history.replaceState({}, '', url);
}

function loadFromURL() {
  const params = new URLSearchParams(window.location.search);
  const lot = params.get('lot');
  const dir = params.get('direction');
  const pid = params.get('product_id');
  if (lot) {
    searchInput.value = lot;
    selectedLotCode = lot;
    selectedProductId = pid ? parseInt(pid) : null;
    document.getElementById('traceBtn').disabled = false;
    if (dir === 'backward' || dir === 'forward') setDirection(dir);
    runTrace(); // a lot-history deep link does not depend on the recent-lot index
  }
}

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
(async function init() {
  loadFromURL();
  await buildLotIndex();
})();
